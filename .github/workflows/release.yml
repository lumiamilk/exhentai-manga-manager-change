name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-basic:
    name: Build Basic Version
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Package with electron-builder
        run: npx electron-builder --win nsis --x64 --config.directories.output=out-basic --config.extraResources=[]

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exhentai-manga-manager-basic-${{ steps.get_version.outputs.VERSION }}
          path: |
            out-basic/*.exe
          retention-days: 1
          if-no-files-found: warn

  release:
    name: Create Release
    needs: build-basic
    runs-on: ubuntu-latest

    steps:
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: exhentai-manga-manager-basic-${{ steps.get_version.outputs.VERSION }}
          path: ./release-files

      - name: List release files
        run: ls -la ./release-files

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## exhentai-manga-manager ${{ steps.get_version.outputs.VERSION }}

            ### 下载说明

            - **基础版** (~200MB): 仅包含漫画管理功能，翻译功能需手动配置
            - **完整版** (~6GB): 需在本地构建，包含翻译功能所有依赖

            ### 完整版构建方法

            ```powershell
            git clone https://github.com/lumiamilk/exhentai-manga-manager-change.git
            cd exhentai-manga-manager-change
            npm install
            npm run dist:full
            ```

            详细说明请查看 [README.md](https://github.com/lumiamilk/exhentai-manga-manager-change#readme)

          files: ./release-files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
